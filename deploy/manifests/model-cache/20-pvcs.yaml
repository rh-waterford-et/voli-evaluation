apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache-node-32
  namespace: model-serving
  labels:
    app.kubernetes.io/part-of: model-serving
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: wetlab-local-model-cache
  resources:
    requests:
      storage: 100Gi
  selector:
    matchLabels:
      evaluation.example.com/cache-node: node-32

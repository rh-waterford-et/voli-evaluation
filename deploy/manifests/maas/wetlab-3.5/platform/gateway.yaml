# Wetlab internal-only MaaS Gateway. ClusterIP keeps it off external ingress;
# external exposure and Praxis integration require separate review.
# For reproduction, adapt the class, hostname, certificate and node/cache.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-gateway-options
  namespace: openshift-ingress
data:
  service: |
    spec:
      type: ClusterIP
  deployment: |
    spec:
      replicas: 1
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: example-gpu-node-42
          containers:
            - name: istio-proxy
              imagePullPolicy: Never
              resources:
                requests: {cpu: 500m, memory: 256Mi}
                limits: {cpu: "2", memory: 2Gi}
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 1
      maxReplicas: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  annotations:
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
spec:
  gatewayClassName: data-science-gateway-class
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: maas-gateway-options
  listeners:
    - name: https
      hostname: maas.apps.example.com
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [openshift-ingress, redhat-ai-gateway-infra, redhat-ods-applications, model-serving]
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: router-certs-default

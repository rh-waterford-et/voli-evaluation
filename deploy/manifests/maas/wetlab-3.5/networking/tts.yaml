# Wetlab-specific API IPs. On another cluster, replace these addresses with
# `oc get -n default svc kubernetes` and its current endpoints before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kserve-maas-bm003-epp-to-kube-api
  namespace: model-serving
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kserve-maas-bm003
      app.kubernetes.io/component: llminferenceservice-router-scheduler
      app.kubernetes.io/part-of: llminferenceservice
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 192.0.2.10/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: 192.0.2.11/32}
        - ipBlock: {cidr: 192.0.2.12/32}
        - ipBlock: {cidr: 192.0.2.13/32}
      ports:
        - {protocol: TCP, port: 6443}
---
# Admit only the dedicated MaaS Gateway to this KServe scheduler and workload.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-maas-gateway-to-kserve-bm003-epp
  namespace: model-serving
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kserve-maas-bm003
      app.kubernetes.io/component: llminferenceservice-router-scheduler
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openshift-ingress}
          podSelector:
            matchLabels: {gateway.networking.k8s.io/gateway-name: maas-default-gateway}
      ports:
        - {protocol: TCP, port: 9002}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-maas-gateway-to-kserve-bm003-model
  namespace: model-serving
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kserve-maas-bm003
      kserve.io/component: workload
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openshift-ingress}
          podSelector:
            matchLabels: {gateway.networking.k8s.io/gateway-name: maas-default-gateway}
      ports:
        - {protocol: TCP, port: 8000}

apiVersion: v1
kind: Service
metadata:
  name: maas-postgres
  namespace: model-serving
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: maas-postgres-tls
spec:
  selector:
    app: maas-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-postgres-tls-config
  namespace: model-serving
data:
  tls.conf: |
    ssl = on
    ssl_cert_file = '/var/run/postgres-tls/tls.crt'
    ssl_key_file = '/var/run/postgres-tls/tls.key'
---
# Allow workloads in the MaaS infrastructure namespace to reach only the
# PostgreSQL pods on TCP 5432. Existing namespace policies remain in force.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-maas-infra-to-postgres
  namespace: model-serving
spec:
  podSelector:
    matchLabels:
      app: maas-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ai-gateway-infra
      ports:
        - protocol: TCP
          port: 5432

# Test access is limited to example-user. Adapt identity and limits for another cluster.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata: {name: qwen3-asr, namespace: model-serving}
spec:
  modelRef: {kind: LLMInferenceService, name: kserve-maas-qwen3-asr}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata: {name: wetlab-qwen3-asr-test, namespace: models-as-a-service}
spec:
  modelRefs:
    - {name: qwen3-asr, namespace: model-serving}
  subjects:
    users: [example-user]
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata: {name: wetlab-qwen3-asr-test, namespace: models-as-a-service}
spec:
  owner:
    users: [example-user]
  modelRefs:
    - name: qwen3-asr
      namespace: model-serving
      tokenRateLimits:
        - {limit: 10000, window: 1m}
